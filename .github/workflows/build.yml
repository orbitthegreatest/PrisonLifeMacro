name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish release build
        run: dotnet publish PrisonLifeMacro.csproj -c Release -o artifacts --nologo

      - name: Upload exe as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrisonLifeMacro
          path: artifacts/PrisonLifeMacro.exe

      - name: Create/update GitHub release with the exe
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/PrisonLifeMacro.exe
            windivert/SMCWinDivert.dll
            windivert/SMCWinDivert64.sys
          generate_release_notes: true